<body>

    <h1 class="shake">Reach out!</h1>

    <div class="input-container">

        <form id="contact-form"  class="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <span id="e-name" class="error-msg"></span>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
            <span id="e-phone" class="error-msg"></span>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <span id="e-email" clasS="error-msg"></span>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" style="resize: none;"></textarea>
            <span id="e-msg" class="error-msg"></span>

            <button type="submit" class="btn-primary">Submit</button>
        </form>
